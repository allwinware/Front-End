<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0">
		<title>AlphaSeat</title>
		<link rel="stylesheet" href="./resource/css/content.css">
		<style>
			/* 모바일: 가로 100% 꽉 채움 / 세로는 이미지 비율에 따라 동적 */
			.allwin_demo .alpha { max-width: 750px; margin: 0 auto; }
			.allwin_demo .alpha img { width: 100%; max-width: 100%; height: auto; display: block; }

			/* 진행중 표시: 화면 상단 얇은 프로그레스 바 (지정한 시간 동안 0% -> 100%) */
			.demo_progress { position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 10; background: rgba(255,255,255,0.25); pointer-events: none; }
			.demo_progress span { display: block; width: 0; height: 100%; background: #3d7cff; }
			.demo_progress.run span { width: 100%; transition: width linear; }
		</style>
		<script type="text/javascript">

			function moveUrl() {
				var urlSearch	= new URLSearchParams(location.search);
				var mode		= urlSearch.get("mode");
				switch (mode) {					
					case "stg"	:
						window.location.href	= "https://stg-demo-mo.ags-aws.com/demo/bsp/myrealtrip/indep/login/aces/4";
						break;
					case "dev"	:
						window.location.href	= "https://dev-demo-mo.ags-aws.com/demo/bsp/myrealtrip/indep/login/aces/4";
						break;
					case "prod"	:
						window.location.href	= "https://prod-demo.m.ags-aws.com/demo/bsp/myrealtrip/indep/login/aces/4";
						break;
					default	:
						window.location.href	= "https://stg-demo-mo.ags-aws.com/demo/bsp/myrealtrip/indep/login/aces/4";
				}
			}

			// ★ 설정 ★
			var REDIRECT_SEC = 3;	// 페이지 진입 후 화면 전환까지 대기 시간(초) - 필요 시 조정

			window.addEventListener("load", function () {
				// 프로그레스 바 애니메이션 시작 (대기 시간과 동일하게 적용)
				var bar = document.getElementById("progress");
				bar.firstElementChild.style.transitionDuration = REDIRECT_SEC + "s";
				requestAnimationFrame(function () {
					requestAnimationFrame(function () { bar.className += " run"; });
				});

				// 지정한 시간 후 화면 전환
				setTimeout(function () {
					moveUrl();
				}, REDIRECT_SEC * 1000);
			});
		</script>
	</head>
	<body>
		<div class="demo_progress" id="progress"><span></span></div>
		<div class="allwin_demo">
			<div class="alpha">
				<img id="img" src="./resource/img/mrt_v2_5.jpg">
			</div>
		</div>
	</body>
</html>
