<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0">
		<title>AlphaSeat</title>
		<link rel="stylesheet" href="./resource/css/content.css">
		<style>
			/* 모바일: 가로 100% 꽉 채움 / 세로는 이미지 비율에 따라 동적 */
			.allwin_demo .alpha { max-width: 750px; margin: 0 auto; }
			.allwin_demo .alpha img { width: 100%; max-width: 100%; height: auto; display: block; }
		</style>
		<script type="text/javascript">
			// ★ 설정 ★ 마지막 화면 클릭 시 이동할 URL (전달받은 URL을 아래에 입력)
			var NEXT_URL = "";

			function moveUrl() {
				if (!NEXT_URL) {
					console.warn("NEXT_URL 이 설정되지 않았습니다.");
					return;
				}
				window.location.href = NEXT_URL;
			}
		</script>
	</head>
	<body>
		<div class="allwin_demo">
			<div class="alpha">
				<a href="javascript:;" onclick="moveUrl();">
				<img id="img" src="./resource/img/mrt_v2_13.jpg"></a>
			</div>
		</div>
	</body>
</html>
